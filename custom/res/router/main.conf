# QlaudeGC built-in MAVLink router
#
# Same format as mavlink-router's /etc/mavlink-router/main.conf. Edit it from the
# router indicator (Configure...), or by hand and press Reload.
#
# QGroundControl keeps its normal links (the drone still connects on UDP 14550, radios
# auto-connect, etc.). Every QGC link is bridged into the router automatically, so the
# endpoints below get the vehicle's traffic and can talk back to the vehicle.
#
# Section types:
#   [UdpEndpoint <name>]   Mode = Normal (send to Address:Port) or Server (listen on Address:Port)
#   [TcpEndpoint <name>]   Address, Port, RetryTimeout (seconds)
#   [UartEndpoint <name>]  Device (COM5 / /dev/ttyUSB0), Baud, FlowControl
# Optional per endpoint: AllowMsgIdOut / BlockMsgIdOut = comma-separated message ids

[General]
# Other tools can also connect over TCP. 0 disables.
TcpServerPort = 5760

# MAVSDK: default connection url udp://:14540 listens on 14540, so the router sends there.
[UdpEndpoint mavsdk]
Mode = Normal
Address = 127.0.0.1
Port = 14540
